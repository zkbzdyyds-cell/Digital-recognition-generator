<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>IMAGE OBSERVER · BUILD 02.3</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #17202c; background: #f4f5f7; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1320px; margin: 0 auto; padding: 44px 32px 32px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 12px; }
    h1 { font-size: 25px; font-weight: 650; letter-spacing: -0.9px; margin: 0; }
    .version { color: #69778a; font-weight: 400; font-size: 16px; margin-left: 8px; letter-spacing: 0; }
    .build { color: #0050ff; background: #e9efff; border: 1px solid #d7e3ff; padding: 7px 11px; border-radius: 6px; font-size: 12px; white-space: nowrap; }
    .intro { color: #687586; font-size: 13px; line-height: 1.7; margin: 0 0 28px; }
    .upload { position: relative; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 9px; padding: 26px 20px; background: #fff; border: 1px dashed #b9c6d9; border-radius: 10px; cursor: pointer; transition: border-color .15s, background .15s; }
    .upload:hover, .upload.dragging { border-color: #0050ff; background: #f8faff; }
    .upload:focus-within { outline: 2px solid #0050ff; outline-offset: 3px; }
    .upload svg { color: #0050ff; }
    .upload strong { font-size: 14px; font-weight: 550; }
    .upload span { font-size: 12px; color: #7b8796; }
    .upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }

    .structure { display: grid; grid-template-columns: auto 1fr 28px; gap: 14px; align-items: center; margin: 18px 0 0; font-size: 13px; }
    .structure input { min-width: 0; width: 100%; accent-color: #0050ff; }
    .structure output { text-align: right; color: #687586; font-variant-numeric: tabular-nums; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel { min-width: 0; border: 1px solid #dfe4eb; border-radius: 10px; background: #fff; overflow: hidden; }
    h2 { margin: 0; padding: 16px 19px; font-size: 13px; font-weight: 550; border-bottom: 1px solid #edf0f4; }
    .preview { min-height: 350px; padding: 18px; display: flex; align-items: center; justify-content: center; background: #fafbfc; }
    .placeholder { color: #9ba5b3; font-size: 13px; text-align: center; }

    #original { cursor: crosshair; }
    #resetFocus { margin-top: 14px; padding: 7px 11px; border: 1px solid #b9c6d9; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; }
    #resetFocus:disabled { opacity: .5; cursor: default; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }

    #downloadPNG { color: #0050ff; border-color: #8aafff; }
    .controls { display: flex; flex-wrap: wrap; align-items: end; gap: 14px; margin: 18px 0 0; font-size: 13px; }
    .control { display: flex; flex-direction: column; gap: 7px; }

    #customTextField { margin-top: 14px; font-size: 13px; max-width: 460px; }
    #customText { width: 100%; }

    [hidden] { display: none !important; }
    @media (max-width: 700px) {
      main { padding: 25px 16px; }
      header { align-items: flex-start; flex-direction: column; gap: 12px; }
      h1 { font-size: 23px; }
      .panels { grid-template-columns: 1fr; gap: 16px; }
      .preview { min-height: 240px; padding: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>IMAGE OBSERVER · BUILD 02.3</h1>
      <span class="build">Detection</span>
    </header>
    <p class="intro">上传一张图片，观察图像结构中的信息区域。所有处理均在当前浏览器本地完成。</p>
    <label class="upload" id="dropZone" for="upload">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg>
      <strong>点击上传图片，或将图片拖到这里</strong>
      <span>JPG / PNG · 最长边不超过 1600px · 无需联网</span>
      <input id="upload" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" aria-label="上传 JPG 或 PNG 图片">
    </label>
    <label class="structure" for="structure"><span>Structure</span><input id="structure" type="range" min="0" max="100" step="1" value="45"><output id="structureValue" for="structure">45</output></label>
    <div class="actions">
      <button id="resetFocus" type="button" disabled>Reset Focus / 恢复自动</button>
      <button id="downloadPNG" type="button" disabled>下载 PNG</button>
    </div>
    <div class="controls">
      <label class="control" for="strokeWidth">Stroke Width
        <select id="strokeWidth">
          <option value="Thin">Thin · 1px</option>
          <option value="Medium" selected>Medium · 2px</option>
          <option value="Thick">Thick · 4px</option>
        </select>
      </label>
      <label class="control" for="labelMode">Labels
        <select id="labelMode">
          <option value="Off">Off</option>
          <option value="Emotion Pool" selected>Emotion Pool</option>
          <option value="Custom Text">Custom Text</option>
        </select>
      </label>
      <button id="shuffleWord" type="button" disabled>换一个 / Shuffle Word</button>
    </div>
    <label class="control" id="customTextField" for="customText" hidden>Custom Text · English · 32 characters max
      <input id="customText" type="text" maxlength="32" autocomplete="off" spellcheck="false" placeholder="MELANCHOLY">
    </label>
    <p id="status" role="status" aria-live="polite">请选择一张图片。</p>
    <div class="panels">
      <section class="panel" aria-labelledby="originalLabel">

        <div class="preview">
          <span class="placeholder" id="originalPlaceholder">上传后显示原图</span>
          <canvas id="original" hidden role="img" aria-label="原图预览，点击指定 Focus"></canvas>
        </div>
      </section>
      <section class="panel" aria-labelledby="outputLabel">
        <h2 id="outputLabel">Detection 输出图</h2>
        <div class="preview">
          <span class="placeholder" id="outputPlaceholder">上传后生成蓝色检测框</span>
          <canvas id="output" hidden role="img" aria-label="蓝色检测框输出图"></canvas>
        </div>
      </section>
    </div>
  </main>
  <script>
/* Detection Build 02.2: local, deterministic CPU image analysis; no models or network. */
(function (root) {
  'use strict';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // Fit exclusive-right/bottom coordinates. Area limits are fractions of the image.
  // Search integer dimensions so even small images respect the limits when feasible.
  function fit(box, w, h, minArea = 0.08, maxArea = 0.80) {
    w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
    const bw = Math.max(1, Math.abs(box[2] - box[0]));
    const bh = Math.max(1, Math.abs(box[3] - box[1]));
    const cx = (box[0] + box[2]) / 2, cy = (box[1] + box[3]) / 2;
    const lo = Math.max(1, Math.ceil(w * h * minArea));
    const hi = Math.max(1, Math.floor(w * h * maxArea));
    let best = null, bestScore = Infinity;
    for (let pass = 0; pass < 2 && !best; pass++) {
      for (let ww = 1; ww <= w; ww++) {
        let lower = Math.max(1, Math.ceil(ww / 3.5));
        let upper = Math.min(h, Math.floor(ww * 3.5));
        if (pass === 0) {
          lower = Math.max(lower, Math.ceil(lo / ww));
          upper = Math.min(upper, Math.floor(hi / ww));
        }
        if (lower > upper) continue;
        const hh = clamp(Math.round(bh), lower, upper);
        const score = Math.log(ww / bw) ** 2 + Math.log(hh / bh) ** 2;
        if (score < bestScore) { bestScore = score; best = [ww, hh]; }
      }
    }
    if (!best) best = [1, 1];
    const x = clamp(Math.round(cx - best[0] / 2), 0, w - best[0]);
    const y = clamp(Math.round(cy - best[1] / 2), 0, h - best[1]);
    return [x, y, x + best[0], y + best[1]];
  }

  function integral(values, w, h) {
    const stride = w + 1, out = new Float64Array(stride * (h + 1));
    for (let y = 0; y < h; y++) {
      let row = 0;
      for (let x = 0; x < w; x++) {
        row += values[y * w + x];
        out[(y + 1) * stride + x + 1] = row + out[y * stride + x + 1];
      }
    }
    return out;
  }
  function sum(ii, s, b) {
    return ii[b[3] * s + b[2]] - ii[b[1] * s + b[2]]
      - ii[b[3] * s + b[0]] + ii[b[1] * s + b[0]];
  }
  const area = b => (b[2] - b[0]) * (b[3] - b[1]);
  function iou(a, b) {
    const intersect = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0]))
      * Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
    return intersect / Math.max(1, area(a) + area(b) - intersect);
  }

  // Separable, replicated-border box blur; coarse maps suppress fine texture.
  function blur(values, w, h, radius) {
    const temp = new Float64Array(w * h), out = new Float32Array(w * h), divisor = 2 * radius + 1;
    for (let y = 0; y < h; y++) {
      let value = 0;
      for (let k = -radius; k <= radius; k++) value += values[y * w + clamp(k, 0, w - 1)];
      for (let x = 0; x < w; x++) {
        temp[y * w + x] = value / divisor;
        value += values[y * w + clamp(x + radius + 1, 0, w - 1)] - values[y * w + clamp(x - radius, 0, w - 1)];
      }
    }
    for (let x = 0; x < w; x++) {
      let value = 0;
      for (let k = -radius; k <= radius; k++) value += temp[clamp(k, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) {
        out[y * w + x] = value / divisor;
        value += temp[clamp(y + radius + 1, 0, h - 1) * w + x] - temp[clamp(y - radius, 0, h - 1) * w + x];
      }

  }
  function normalized(values) {
    const sorted = Float32Array.from(values).sort();
    const index = (sorted.length - 1) * .98, lower = Math.floor(index);
    let limit = sorted[lower] + (sorted[Math.min(lower + 1, sorted.length - 1)] - sorted[lower]) * (index - lower);

      const next = new Float32Array(512);
      for (let i = 0; i < 512; i++) {

        next[i] = (current[coordinate ? i - step : i] + 2 * current[i]

  function detailFallback(main, w, h) {
    const mw = main[2] - main[0], mh = main[3] - main[1];
    return [[.08,.10,.52,.54],[.47,.46,.92,.91],[.48,.08,.91,.51],[.09,.48,.52,.91]].map(b =>
      fit([b[0] * mw, b[1] * mh, b[2] * mw, b[3] * mh], mw, mh,
        Math.min(.008 * w * h / (mw * mh), .4), .65)
        .map((value, index) => value + main[index % 2]));
  }
  function fallback(w, h, focus=null) {
    const main = focus
      ? fit([focus[0]-.19*w,focus[1]-.19*h,focus[0]+.19*w,focus[1]+.19*h],w,h,.08,.8)
      : fit([.22*w, .22*h, .78*w, .78*h], w, h, .08, .8);
    return [main, ...detailFallback(main, w, h).slice(0, 2)];
  }
  function subjectMap(channels, gray, w, h) {
    const n = w * h, side = Math.min(w, h);
    const small = channels.map(c => blur(c, w, h, Math.max(1, Math.round(side * .015))));
    const broad = channels.map(c => blur(c, w, h, Math.max(2, Math.round(side * .12))));
    const smallGray = new Float32Array(n), encoded = new Uint16Array(n);
    const allHist = new Float32Array(512), borderHist = new Float32Array(512);
    const border = Math.max(1, Math.round(side * .06)), means = [0, 0, 0];
    let borderCount = 0;
    for (let i = 0; i < n; i++) {
      const x = i % w, y = Math.floor(i / w);
      smallGray[i] = .299 * small[0][i] + .587 * small[1][i] + .114 * small[2][i];
      encoded[i] = Math.min(7, Math.floor(small[0][i] * 8)) * 64
        + Math.min(7, Math.floor(small[1][i] * 8)) * 8 + Math.min(7, Math.floor(small[2][i] * 8));
      allHist[encoded[i]]++;
      if (x < border || y < border || x >= w-border || y >= h-border) { borderHist[encoded[i]]++; borderCount++; }
      for (let c = 0; c < 3; c++) means[c] += small[c][i] / n;
    }
    for (let i = 0; i < 512; i++) { allHist[i] /= n; borderHist[i] /= Math.max(1, borderCount); }
    const allDensity = smoothHistogram(allHist), borderDensity = smoothHistogram(borderHist);
    const coarse = new Float32Array(n), globalContrast = new Float32Array(n), fine = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let localDistance = 0, globalDistance = 0;
      for (let c = 0; c < 3; c++) { localDistance += (small[c][i] - broad[c][i]) ** 2; globalDistance += (small[c][i] - means[c]) ** 2; }
      coarse[i] = Math.sqrt(localDistance / 3); globalContrast[i] = Math.sqrt(globalDistance / 3);
      fine[i] = Math.abs(gray[i] - smallGray[i]);
    }
    const coarseNorm = normalized(coarse), globalNorm = normalized(globalContrast);
    const fineMean = blur(fine, w, h, Math.max(1, Math.round(side * .012))), confidence = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const novelty = clamp((allDensity[encoded[i]] - 1.15 * borderDensity[encoded[i]]) / (allDensity[encoded[i]] + .002), 0, 1);
      const textureGate = 1 / (1 + 1.8 * fineMean[i] / (.025 + coarse[i]));
      const darkGate = .08 + .92 * clamp((smallGray[i] - .025) / .14, 0, 1);
      confidence[i] = (.60 * novelty + .25 * coarseNorm[i] + .15 * globalNorm[i]) * textureGate * darkGate;
    }
    return normalized(blur(confidence, w, h, Math.max(1, Math.round(side * .018))));
  }
  function informationMap(channels, gray, w, h) {
    // Fine edges are only a 3% tie-breaker, gated by coherent subject confidence.
    const n = w * h, smooth = blur(gray, w, h, 1), broad = blur(gray, w, h, 5);
    const colorBroad = channels.map(c => blur(c, w, h, 9));
    const edges = new Float32Array(n), contrast = new Float32Array(n), colors = new Float32Array(n);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      edges[i] = Math.hypot(smooth[y*w+Math.min(w-1,x+1)] - smooth[y*w+Math.max(0,x-1)],
        smooth[Math.min(h-1,y+1)*w+x] - smooth[Math.max(0,y-1)*w+x]);
      contrast[i] = Math.abs(gray[i] - broad[i]);
      colors[i] = Math.hypot(channels[0][i]-colorBroad[0][i], channels[1][i]-colorBroad[1][i], channels[2][i]-colorBroad[2][i]);
    }
    const e = normalized(edges), c = normalized(contrast), k = normalized(colors);
    return blur(Float32Array.from(e, (value, i) => .5*value + .3*c[i] + .2*k[i]), w, h, 2);
  }
  function components(mask, w, h) {
    const labels = new Int32Array(w*h), queue = new Int32Array(w*h), regions = [];
    let label = 0;
    for (let start = 0; start < mask.length; start++) {
      if (!mask[start] || labels[start]) continue;
      let head = 0, tail = 1, x1 = w, y1 = h, x2 = 0, y2 = 0;
      queue[0] = start; labels[start] = ++label;
      while (head < tail) {
        const p = queue[head++], x = p % w, y = Math.floor(p / w);
        x1 = Math.min(x1,x); y1 = Math.min(y1,y); x2 = Math.max(x2,x+1); y2 = Math.max(y2,y+1);
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const nx = x+dx, ny = y+dy, q = ny*w+nx;
          if (nx>=0 && nx<w && ny>=0 && ny<h && mask[q] && !labels[q]) { labels[q] = label; queue[tail++] = q; }
        }
      }
      regions.push({ box: [x1,y1,x2,y2], pixels: tail });
    }
    return { labels, regions, count: label };
  }
  function compareBoxes(a, b) { for (let i = 0; i < 4; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; }
  function unique(boxes) { return [...new Map(boxes.map(box => [box.join(','), box])).values()]; }
  function analyze(image, capture, focus=null) {
    const w = image.width, h = image.height, n = w*h, rgba = image.data;
    if (w<3 || h<3 || !rgba || rgba.length<n*4) return fallback(w,h,focus);
    const channels = [new Float32Array(n), new Float32Array(n), new Float32Array(n)], gray = new Float32Array(n);
    const sums = [0,0,0], squares = [0,0,0];
    for (let i=0; i<n; i++) {
      const alpha = rgba[i*4+3]/255;
      for (let c=0; c<3; c++) { const value = (rgba[i*4+c]*alpha+255*(1-alpha))/255;
        channels[c][i] = value; sums[c] += value; squares[c] += value*value; }
      gray[i] = .299*channels[0][i]+.587*channels[1][i]+.114*channels[2][i];
    }
    if (Math.max(...sums.map((value,c) => Math.sqrt(Math.max(0,squares[c]/n-(value/n)**2)))) < .05/255) return fallback(w,h,focus);
    const subject = subjectMap(channels,gray,w,h), fine = informationMap(channels,gray,w,h);
    if (capture) { capture.subject = subject; capture.detail = fine; }
    // A click supplies a spatial prior, never an object-class assumption. Keep
    // the un-focused map unchanged so Reset reproduces the automatic result.
    const info = Float32Array.from(subject,(value,i) => focus
      ? (.65*value+.35*fine[i])*(.12+.88*Math.exp(-.5*((((i%w)-focus[0])/(.18*w))**2+((Math.floor(i/w)-focus[1])/(.18*h))**2)))
      : .97*value+.03*fine[i]*value);

    if (total<1e-4) return fallback(w,h,focus);

    const radius = (Math.max(3,Math.round(Math.min(w,h)*.016))|1)>>1;
    let support;
    for (const threshold of [.28,.46,.66]) {
      const mask = Uint8Array.from(subject,value=>value>=threshold?1:0);
      // Ignore floating-point residue below half of one occupied kernel pixel.
      const minimumHit = .5 / ((2*radius+1)**2);
      const dilated = Uint8Array.from(blur(mask,w,h,radius),value=>value>=minimumHit?1:0);
      const closed = Uint8Array.from(blur(dilated,w,h,radius),value=>value>=1-1e-6?1:0);
      const grouped = components(closed,w,h);
      if (!support) support = grouped;
      for (const region of grouped.regions.sort((a,b)=>b.pixels-a.pixels).slice(0,32)) {
        if (region.pixels<Math.max(4,n*.0015)) continue;
        const [x1,y1,x2,y2] = region.box, pad = Math.max(2,Math.round(Math.min(x2-x1,y2-y1)*.06));
        candidates.push([x1-pad,y1-pad,x2+pad,y2+pad]);
      }
    }
    const peaks = Float32Array.from(subject);
    for (let p=0; p<12; p++) {
      let index = 0;
      for (let i=1; i<n; i++) if (peaks[i]>peaks[index]) index=i;
      if (peaks[index]<.10) break;
      const x = index%w, y = Math.floor(index/w);
      for (const f of [.28,.42,.56,.68]) candidates.push([x-w*f/2,y-h*f/2,x+w*f/2,y+h*f/2]);
      const rx = Math.max(1,Math.round(w*.14)), ry = Math.max(1,Math.round(h*.14));
      for (let yy=Math.max(0,y-ry); yy<Math.min(h,y+ry+1); yy++) peaks.fill(0,yy*w+Math.max(0,x-rx),yy*w+Math.min(w,x+rx+1));
    }
    if (focus) {
      // Local windows ensure useful, bounded candidates even if the automatic
      // connected components belong to a different subject elsewhere.
      for (const f of [.28,.38,.48]) for (const ratio of [.8,1,1.25]) {
        const bw=w*f*ratio,bh=h*f/ratio;
        candidates.push([focus[0]-bw/2,focus[1]-bh/2,focus[0]+bw/2,focus[1]+bh/2]);
      }
    }
    const populations = new Int32Array(support.count+1), stamps = new Int32Array(support.count+1), cache = new Map();
    let stamp = 0;
    function score(box) {
      const key = box.join(','); if (cache.has(key)) return cache.get(key);
      const [x1,y1,x2,y2] = box, a = area(box), fraction = a/n, mass = sum(ii,stride,box);
      let occupied = 0, largest = 0; stamp++;
      for (let y=y1; y<y2; y++) for (let x=x1; x<x2; x++) {
        const label = support.labels[y*w+x]; if (!label) continue;
        if (stamps[label]!==stamp) { stamps[label]=stamp; populations[label]=0; }

    function renderOverlay() {
      updateLabelControls();
      if (!retained || !cachedLayers) return;
      const labels = ObserverOverlay.render(output.getContext("2d"), original, cachedLayers, {
        strokeWidth: strokeWidth.value, labelMode: labelMode.value,
        word: wordState && wordState.word, customText: customText.value
      });
      output.dataset.word = wordState ? wordState.word : "";
      output.dataset.labels = JSON.stringify(labels);
      output.dataset.stroke = strokeWidth.value;
      output.dataset.mode = labelMode.value;
      downloadPNG.disabled = !!pendingExport;
    }

    async function showImage(file) {
      const current = ++generation;
      clearImages();
      if (!file) {
        message("请选择一张图片。", "empty");
        return;
      }
      message("正在分析图片…", "loading");
      let objectURL;
      try {
        // Inspect file signatures instead of trusting an extension or MIME type.
        const header = new Uint8Array(await file.slice(0,12).arrayBuffer());
        if (current !== generation) return;
        const jpeg = header[0]===255 && header[1]===216 && header[2]===255;
        const pngSignature = [137,80,78,71,13,10,26,10];
        const png = pngSignature.every((value,index) => header[index]===value);
        if (!jpeg && !png) throw new Error("请使用完整的 JPG 或 PNG 图片。");
        objectURL = URL.createObjectURL(file);
        const image = new Image();
        image.src = objectURL;
        // Current Chrome / Edge apply JPEG EXIF orientation during decoding.
        await image.decode();
        if (current !== generation) return;
        const scale = Math.min(1,1600/Math.max(image.naturalWidth,image.naturalHeight));
        const width = Math.max(1,Math.round(image.naturalWidth*scale));
        const height = Math.max(1,Math.round(image.naturalHeight*scale));
        original.width = output.width = width;
        original.height = output.height = height;
        const sourceContext = original.getContext("2d",{willReadFrequently:true});
        sourceContext.fillStyle = "#fff";
        sourceContext.fillRect(0,0,width,height);
        sourceContext.imageSmoothingQuality = "high";
        sourceContext.drawImage(image,0,0,width,height);
        let data = null;
        try {
          const analysis = document.createElement("canvas");
          const analysisScale = Math.min(1,480/Math.max(width,height));
          analysis.width = Math.max(1,Math.round(width*analysisScale));
          analysis.height = Math.max(1,Math.round(height*analysisScale));
          const context = analysis.getContext("2d",{willReadFrequently:true});
          context.drawImage(original,0,0,analysis.width,analysis.height);
          data = context.getImageData(0,0,analysis.width,analysis.height);
        } catch (error) { console.warn("Using the stable detection fallback.",error); }
        retained = {data,width,height};
        // A separate image-bound word stream: regular repaint, Focus and
        // Structure changes must not advance it. No shared Math.random().
        wordState = ObserverOverlay.createWordState(ObserverOverlay.imageSeed(data));
        // Read the current slider after decoding; pending uploads use its latest value.
        renderOutput();
        message(`${file.name} · ${width} × ${height} · 完成`,"done");
      } catch (error) {
        if (current !== generation) return;
        clearImages();
        message(error.message.includes("JPG") ? error.message : "无法读取图片，请重新选择完整的 JPG 或 PNG 文件。","error");
      } finally {
        if (objectURL) URL.revokeObjectURL(objectURL);
      }
    }

    original.addEventListener("click",event => {
      if (!retained || original.hidden) return;
      // The canvas element itself has the image's intrinsic ratio. Its CSS box
      // has no border/padding/letterboxing, so client-to-pixel scaling is exact
      // even in a narrow viewport or after the page has been scrolled.
      const bounds=original.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return;
      focus=[Math.min(original.width-1,Math.max(0,Math.floor((event.clientX-bounds.left)*original.width/bounds.width))),
        Math.min(original.height-1,Math.max(0,Math.floor((event.clientY-bounds.top)*original.height/bounds.height)))];
      clearTimeout(structureTimer);
      renderOutput();
    });
    resetFocus.addEventListener("click",() => {
      focus=null;
      clearTimeout(structureTimer);
      renderOutput();
    });
    structure.addEventListener("input",() => {
      structureValue.value = structure.value;
      structureValue.textContent = structure.value;
      clearTimeout(structureTimer);
      structureTimer = setTimeout(renderOutput,80);
    });
    strokeWidth.addEventListener("change", renderOverlay);
    labelMode.addEventListener("change", renderOverlay);
    customText.addEventListener("input", () => {
      // Synchronous local updates preserve a trailing space while typing a
      // phrase, and preserve the caret when editing in the middle of a word.
      const sanitize = value => value.replace(/[^A-Za-z '\-]/g, "").toUpperCase().slice(0,32);
      const caret = sanitize(customText.value.slice(0,customText.selectionStart)).length;
      customText.value = sanitize(customText.value);
      customText.setSelectionRange(caret,caret);
      renderOverlay();
    });
    shuffleWord.addEventListener("click", () => {
      if (!retained || !cachedLayers || labelMode.value !== "Emotion Pool") return;
      wordState = ObserverOverlay.shuffleWord(wordState);
      renderOverlay();
    });
    downloadPNG.addEventListener("click", () => {
      if (!retained || !cachedLayers || pendingExport) return;
      const token = {generation};
      pendingExport = token;
      downloadPNG.disabled = true;
      // Freeze the visible result at click time. Later parameter changes cannot
      // change this export; uploading a new image cancels its stale callback.
      const snapshot = document.createElement("canvas");
      snapshot.width = output.width;
      snapshot.height = output.height;
      snapshot.getContext("2d").drawImage(output,0,0);
      const mode = labelMode.value === "Emotion Pool" ? "pool" : labelMode.value === "Custom Text" ? "custom" : "off";
      const point = focus ? `focus_${focus[0]}_${focus[1]}` : "auto";
      const filename = `image_observer_html_build_02_3_s${output.dataset.structure.padStart(3,"0")}_${point}_${strokeWidth.value.toLowerCase()}_${mode}.png`;
      function finish(blob) {
        snapshot.width = snapshot.height = 1;
        if (pendingExport !== token || generation !== token.generation) return;
        pendingExport = null;
        downloadPNG.disabled = false;
        if (!blob) { message("PNG 保存失败，请重试。","error"); return; }
        const url = URL.createObjectURL(blob), link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url),1000);
      }
      try { snapshot.toBlob(finish,"image/png"); }
      catch (_) { finish(null); }
    });
    upload.addEventListener("change",() => showImage(upload.files[0]));
    // Reset just the picker so selecting the same file again triggers analysis.
    upload.addEventListener("click",() => { upload.value = ""; });
    for (const eventName of ["dragenter","dragover"]) {
      dropZone.addEventListener(eventName,event => {
        event.preventDefault();
        dropZone.classList.add("dragging");
      });
    }
    dropZone.addEventListener("dragleave",() => dropZone.classList.remove("dragging"));
    dropZone.addEventListener("drop",event => {
      event.preventDefault();
      dropZone.classList.remove("dragging");
      showImage(event.dataTransfer.files[0]);
    });
  </script>
</body>
</html>
