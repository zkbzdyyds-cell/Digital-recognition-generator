<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src blob: data:; font-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>IMAGE OBSERVER · 构建 02.6.2</title>
  <style>
    @font-face { font-family: "Observer Inter Light"; src: url("assets/fonts/InterDisplay-Light-latin.woff2") format("woff2"); font-weight: 300; font-display: swap; }
    @font-face { font-family: "Observer Inter Medium"; src: url("assets/fonts/InterDisplay-Medium-latin.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    :root { color-scheme: light; font-family: "Observer Inter Light", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-synthesis: none; color: #17202c; background: #f4f5f7; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1320px; margin: 0 auto; padding: 44px 32px 32px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 12px; }
    h1 { font-size: 25px; font-weight: 650; letter-spacing: -0.9px; margin: 0; text-wrap: balance; }
    .version { color: #69778a; font-weight: 400; font-size: 16px; margin-left: 8px; letter-spacing: 0; }
    .build { color: #0050ff; background: #e9efff; border: 1px solid #d7e3ff; padding: 7px 11px; border-radius: 6px; font-size: 12px; white-space: nowrap; }
    .intro { color: #687586; font-size: 13px; line-height: 1.7; margin: 0 0 28px; }
    .upload { position: relative; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 9px; padding: 26px 20px; background: #fff; border: 1px dashed #b9c6d9; border-radius: 10px; cursor: pointer; transition: border-color .15s, background .15s; }
    .upload:hover, .upload.dragging { border-color: #0050ff; background: #f8faff; }
    .upload:focus-within { outline: 2px solid #0050ff; outline-offset: 3px; }
    .upload svg { color: #0050ff; }
    .upload strong { font-size: 14px; font-weight: 550; }
    .upload span { font-size: 12px; color: #7b8796; text-wrap: balance; text-align: center; }
    .upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    #status { min-height: 32px; margin: 10px 0 5px; font-size: 12px; color: #687586; line-height: 1.7; overflow-wrap: anywhere; }
    #status[data-state="error"] { color: #b42c34; }
    .structure { display: grid; grid-template-columns: auto 1fr 28px; gap: 14px; align-items: center; margin: 18px 0 0; font-size: 13px; }
    .structure input { min-width: 0; width: 100%; accent-color: #0050ff; }
    .structure output { text-align: right; color: #687586; font-variant-numeric: tabular-nums; }
    .effect-layers { display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 18px; margin-top: 18px; font-size: 13px; }
    .effect-layer { min-width: 0; }
    .effect-layer select { width: 100%; min-width: 0; }
    .base-parameters { display: grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap: 0 20px; }
    .invert-control { align-self: end; margin-top: 18px; font-size: 13px; }
    #distortionControl { max-width: 460px; margin-top: 14px; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel { min-width: 0; border: 1px solid #dfe4eb; border-radius: 10px; background: #fff; overflow: hidden; }
    h2 { margin: 0; padding: 16px 19px; font-size: 13px; font-weight: 550; border-bottom: 1px solid #edf0f4; }
    .preview { min-height: 350px; padding: 18px; display: flex; align-items: center; justify-content: center; background: #fafbfc; }
    .placeholder { color: #9ba5b3; font-size: 13px; text-align: center; }
    canvas { display: block; max-width: 100%; max-height: 65vh; width: auto; height: auto; object-fit: contain; }
    #original { cursor: crosshair; }
    #resetFocus { margin-top: 14px; padding: 7px 11px; border: 1px solid #b9c6d9; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; }
    #resetFocus:disabled { opacity: .5; cursor: default; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .actions #resetFocus { margin-top: 0; }
    button, select, input { font: inherit; }
    button:disabled { opacity: .5; cursor: default; }
    #downloadPNG, #shuffleWord, #deleteSelected, #resetBoxes { padding: 8px 12px; border: 1px solid #b9c6d9; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; }
    #downloadPNG { color: #0050ff; border-color: #8aafff; }
    .controls { display: flex; flex-wrap: wrap; align-items: end; gap: 14px; margin: 18px 0 0; font-size: 13px; }
    .control { display: flex; flex-direction: column; gap: 7px; }
    .control select, #customText { padding: 8px 10px; color: inherit; background: #fff; border: 1px solid #b9c6d9; border-radius: 6px; }
    .control select { min-width: 155px; }
    #customTextField { margin-top: 14px; font-size: 13px; max-width: 460px; }
    #customText { width: 100%; }
    .edit-controls { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 14px; margin-top: 16px; font-size: 13px; }
    .edit-hint { margin: 8px 0 0; color: #687586; font-size: 12px; line-height: 1.7; }
    #selectionStatus { align-self: center; color: #687586; font-size: 12px; }
    .output-stage { position: relative; line-height: 0; flex: none; }
    .output-stage > #output { width: 100%; height: auto; max-width: none; max-height: none; }
    #editOverlay { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; pointer-events: none; }
    button:focus-visible, select:focus-visible, #customText:focus-visible { outline: 2px solid #0050ff; outline-offset: 3px; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) {
      main { padding: 25px 16px; }
      header { align-items: flex-start; flex-direction: column; gap: 12px; }
      h1 { font-size: 23px; }
      .panels { grid-template-columns: 1fr; gap: 16px; }
      .preview { min-height: 240px; padding: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>IMAGE OBSERVER · 构建 02.6.2</h1>
      <span class="build">识别模式</span>
    </header>
    <p class="intro">上传一张图片，观察图像结构中的信息区域。所有处理均在当前浏览器本地完成。</p>
    <label class="upload" id="dropZone" for="upload">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg>
      <strong>点击上传图片，或将图片拖到这里</strong>
      <span>JPG / PNG · 最长边不超过 1600px · 无需联网</span>
      <input id="upload" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" aria-label="上传 JPG 或 PNG 图片">
    </label>
    <label class="structure" for="structure"><span>结构强度</span><input id="structure" type="range" min="0" max="100" step="1" value="45"><output id="structureValue" for="structure">45</output></label>
    <div class="actions">
      <button id="resetFocus" type="button" disabled>恢复自动焦点</button>
      <button id="downloadPNG" type="button" disabled>下载 PNG 图片</button>
    </div>
    <div class="controls">
      <label class="control" for="strokeWidth">线框粗细
        <select id="strokeWidth">
          <option value="Thin">细 · 1px</option>
          <option value="Medium" selected>中 · 2px</option>
          <option value="Thick">粗 · 4px</option>
        </select>
      </label>
      <label class="control" for="overlayColor">标注颜色
        <select id="overlayColor">
          <option value="#0050FF" selected>蓝色</option>
          <option value="#F44336">红色</option>
          <option value="#00AA64">绿色</option>
          <option value="#FFCC00">黄色</option>
        </select>
      </label>
      <label class="control" for="overlayStyle">标注风格
        <select id="overlayStyle">
          <option value="VECTOR" selected>清晰矢量</option>
          <option value="INK BLEED">柔性溢墨</option>
          <option value="SCAN">数字扫描失真</option>
        </select>
      </label>
      <label class="control" for="labelMode">标签文字
        <select id="labelMode">
          <option value="Off">关闭</option>
          <option value="Emotion Pool" selected>情绪词库</option>
          <option value="Custom Text">自定义文字</option>
        </select>
      </label>
      <button id="shuffleWord" type="button" disabled>换一个</button>
    </div>
    <div class="controls">
      <label class="control" for="baseFilter">底图滤镜<select id="baseFilter"><option value="Original">原图</option><option value="XRay">X光滤镜</option></select></label>
    </div>
    <div id="xrayControls" class="base-parameters" hidden>
      <label class="structure" for="xrayHue"><span>色相</span><input id="xrayHue" type="range" min="0" max="360" value="210"><output>210</output></label>
      <label class="structure" for="xraySaturation"><span>饱和度</span><input id="xraySaturation" type="range" min="0" max="100" value="80"><output>80</output></label>
      <label class="structure" for="xrayLightness"><span>明度</span><input id="xrayLightness" type="range" min="0" max="100" value="65"><output>65</output></label>
      <label class="invert-control"><input id="xrayInvert" type="checkbox">反色</label>
    </div>
    <div class="effect-layers">
      <div class="effect-layer"><label class="control" for="effect1">效果层 1<select id="effect1"><option value="None">无</option><option value="Noise" selected>彩色噪点</option><option value="CRT">复古电视机竖纹</option><option value="Glitch">电子扫描 A｜条带错位</option><option value="Wave">电子扫描 B｜波纹湍流</option><option value="Streak">电子扫描 C｜纵向拉丝</option><option value="Glow">彩色泛光</option></select></label>
        <div id="effectParams1"><label class="structure" for="strength1"><span id="strengthLabel1">强度</span><input id="strength1" type="range" min="0" max="100" value="20"><output>20</output></label>
          <div id="glowParams1" hidden><label class="structure" for="glowHue1"><span>色相</span><input id="glowHue1" type="range" min="0" max="360" value="195"><output>195</output></label><label class="structure" for="glowSaturation1"><span>饱和度</span><input id="glowSaturation1" type="range" min="0" max="100" value="80"><output>80</output></label><label class="structure" for="glowLightness1"><span>亮度</span><input id="glowLightness1" type="range" min="0" max="100" value="65"><output>65</output></label></div></div></div>
      <div class="effect-layer"><label class="control" for="effect2">效果层 2<select id="effect2"><option value="None" selected>无</option><option value="Noise">彩色噪点</option><option value="CRT">复古电视机竖纹</option><option value="Glitch">电子扫描 A｜条带错位</option><option value="Wave">电子扫描 B｜波纹湍流</option><option value="Streak">电子扫描 C｜纵向拉丝</option><option value="Glow">彩色泛光</option></select></label>
        <div id="effectParams2" hidden><label class="structure" for="strength2"><span id="strengthLabel2">强度</span><input id="strength2" type="range" min="0" max="100" value="20"><output>20</output></label>
          <div id="glowParams2" hidden><label class="structure" for="glowHue2"><span>色相</span><input id="glowHue2" type="range" min="0" max="360" value="195"><output>195</output></label><label class="structure" for="glowSaturation2"><span>饱和度</span><input id="glowSaturation2" type="range" min="0" max="100" value="80"><output>80</output></label><label class="structure" for="glowLightness2"><span>亮度</span><input id="glowLightness2" type="range" min="0" max="100" value="65"><output>65</output></label></div></div></div>
      <div class="effect-layer"><label class="control" for="effect3">效果层 3<select id="effect3"><option value="None" selected>无</option><option value="Noise">彩色噪点</option><option value="CRT">复古电视机竖纹</option><option value="Glitch">电子扫描 A｜条带错位</option><option value="Wave">电子扫描 B｜波纹湍流</option><option value="Streak">电子扫描 C｜纵向拉丝</option><option value="Glow">彩色泛光</option></select></label>
        <div id="effectParams3" hidden><label class="structure" for="strength3"><span id="strengthLabel3">强度</span><input id="strength3" type="range" min="0" max="100" value="20"><output>20</output></label>
          <div id="glowParams3" hidden><label class="structure" for="glowHue3"><span>色相</span><input id="glowHue3" type="range" min="0" max="360" value="195"><output>195</output></label><label class="structure" for="glowSaturation3"><span>饱和度</span><input id="glowSaturation3" type="range" min="0" max="100" value="80"><output>80</output></label><label class="structure" for="glowLightness3"><span>亮度</span><input id="glowLightness3" type="range" min="0" max="100" value="65"><output>65</output></label></div></div></div>
    </div>
    <label class="structure" for="vignette"><span>暗角</span><input id="vignette" type="range" min="-100" max="100" step="1" value="0"><output id="vignetteValue" for="vignette">0</output></label>
    <label class="structure" id="distortionControl" for="distortionStrength" hidden><span>失真强度</span><input id="distortionStrength" type="range" min="0" max="100" step="1" value="45"><output id="distortionValue" for="distortionStrength">45</output></label>
    <label class="control" id="customTextField" for="customText" hidden>自定义文字 · 仅限英文 · 最多32个字符
      <input id="customText" type="text" maxlength="32" autocomplete="off" spellcheck="false" placeholder="输入自定义英文文字">
    </label>
    <div class="edit-controls">
      <label class="control" for="editBoxes">编辑方框
        <select id="editBoxes">
          <option value="Off">关闭</option>
          <option value="On" selected>开启</option>
        </select>
      </label>
      <button id="deleteSelected" type="button" disabled>删除选中框</button>
      <button id="resetBoxes" type="button" disabled>恢复自动框</button>
      <span id="selectionStatus" role="status" aria-live="polite">开启后可选中方框边线。</span>
    </div>
    <p class="edit-hint" id="editHint">更换图片、结构强度或焦点将重新生成识别框。</p>
    <p id="status" role="status" aria-live="polite">请选择一张图片。</p>
    <div class="panels">
      <section class="panel" aria-labelledby="originalLabel">
        <h2 id="originalLabel">原图</h2>
        <div class="preview">
          <span class="placeholder" id="originalPlaceholder">上传后显示原图</span>
          <canvas id="original" hidden role="img" aria-label="原图预览，点击指定焦点"></canvas>
        </div>
      </section>
      <section class="panel" aria-labelledby="outputLabel">
        <h2 id="outputLabel">识别输出图</h2>
        <div class="preview">
          <span class="placeholder" id="outputPlaceholder">上传后生成识别框</span>
          <div id="outputStage" class="output-stage" hidden>
            <canvas id="output" hidden role="img" aria-label="识别框输出图" aria-describedby="editHint selectionStatus"></canvas>
            <canvas id="editOverlay" hidden aria-hidden="true"></canvas>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script>
/* Detection Build 02.2: local, deterministic CPU image analysis; no models or network. */
(function (root) {
  'use strict';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // Fit exclusive-right/bottom coordinates. Area limits are fractions of the image.
  // Search integer dimensions so even small images respect the limits when feasible.
  function fit(box, w, h, minArea = 0.08, maxArea = 0.80) {
    w = Math.max(1, Math.round(w)); h = Math.max(1, Math.round(h));
    const bw = Math.max(1, Math.abs(box[2] - box[0]));
    const bh = Math.max(1, Math.abs(box[3] - box[1]));
    const cx = (box[0] + box[2]) / 2, cy = (box[1] + box[3]) / 2;
    const lo = Math.max(1, Math.ceil(w * h * minArea));
    const hi = Math.max(1, Math.floor(w * h * maxArea));
    let best = null, bestScore = Infinity;
    for (let pass = 0; pass < 2 && !best; pass++) {
      for (let ww = 1; ww <= w; ww++) {
        let lower = Math.max(1, Math.ceil(ww / 3.5));
        let upper = Math.min(h, Math.floor(ww * 3.5));
        if (pass === 0) {
          lower = Math.max(lower, Math.ceil(lo / ww));
          upper = Math.min(upper, Math.floor(hi / ww));
        }
        if (lower > upper) continue;
        const hh = clamp(Math.round(bh), lower, upper);
        const score = Math.log(ww / bw) ** 2 + Math.log(hh / bh) ** 2;
        if (score < bestScore) { bestScore = score; best = [ww, hh]; }
      }
    }
    if (!best) best = [1, 1];
    const x = clamp(Math.round(cx - best[0] / 2), 0, w - best[0]);
    const y = clamp(Math.round(cy - best[1] / 2), 0, h - best[1]);
    return [x, y, x + best[0], y + best[1]];
  }

  function integral(values, w, h) {
    const stride = w + 1, out = new Float64Array(stride * (h + 1));
    for (let y = 0; y < h; y++) {
      let row = 0;
      for (let x = 0; x < w; x++) {
        row += values[y * w + x];
        out[(y + 1) * stride + x + 1] = row + out[y * stride + x + 1];
      }
    }
    return out;
  }
  function sum(ii, s, b) {
    return ii[b[3] * s + b[2]] - ii[b[1] * s + b[2]]
      - ii[b[3] * s + b[0]] + ii[b[1] * s + b[0]];
  }
  const area = b => (b[2] - b[0]) * (b[3] - b[1]);
  function iou(a, b) {
    const intersect = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0]))
      * Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
    return intersect / Math.max(1, area(a) + area(b) - intersect);
  }

  // Separable, replicated-border box blur; coarse maps suppress fine texture.
  function blur(values, w, h, radius) {
    const temp = new Float64Array(w * h), out = new Float32Array(w * h), divisor = 2 * radius + 1;
    for (let y = 0; y < h; y++) {
      let value = 0;
      for (let k = -radius; k <= radius; k++) value += values[y * w + clamp(k, 0, w - 1)];
      for (let x = 0; x < w; x++) {
        temp[y * w + x] = value / divisor;
        value += values[y * w + clamp(x + radius + 1, 0, w - 1)] - values[y * w + clamp(x - radius, 0, w - 1)];
      }
    }
    for (let x = 0; x < w; x++) {
      let value = 0;
      for (let k = -radius; k <= radius; k++) value += temp[clamp(k, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) {
        out[y * w + x] = value / divisor;
        value += temp[clamp(y + radius + 1, 0, h - 1) * w + x] - temp[clamp(y - radius, 0, h - 1) * w + x];
      }
    }
    return out;
  }
  function normalized(values) {
    const sorted = Float32Array.from(values).sort();
    const index = (sorted.length - 1) * .98, lower = Math.floor(index);
    let limit = sorted[lower] + (sorted[Math.min(lower + 1, sorted.length - 1)] - sorted[lower]) * (index - lower);
    if (limit < 1e-6) limit = sorted[sorted.length - 1];
    return Float32Array.from(values, value => limit > 1e-6 ? clamp(value / limit, 0, 1) : 0);
  }
  function smoothHistogram(histogram) {
    let current = histogram;
    for (const step of [64, 8, 1]) {
      const next = new Float32Array(512);
      for (let i = 0; i < 512; i++) {
        const coordinate = Math.floor(i / step) % 8;
        next[i] = (current[coordinate ? i - step : i] + 2 * current[i]
          + current[coordinate < 7 ? i + step : i]) / 4;
      }
      current = next;
    }
    return current;
  }
  function detailFallback(main, w, h) {
    const mw = main[2] - main[0], mh = main[3] - main[1];
    return [[.08,.10,.52,.54],[.47,.46,.92,.91],[.48,.08,.91,.51],[.09,.48,.52,.91]].map(b =>
      fit([b[0] * mw, b[1] * mh, b[2] * mw, b[3] * mh], mw, mh,
        Math.min(.008 * w * h / (mw * mh), .4), .65)
        .map((value, index) => value + main[index % 2]));
  }
  function fallback(w, h, focus=null) {
    const main = focus
      ? fit([focus[0]-.19*w,focus[1]-.19*h,focus[0]+.19*w,focus[1]+.19*h],w,h,.08,.8)
      : fit([.22*w, .22*h, .78*w, .78*h], w, h, .08, .8);
    return [main, ...detailFallback(main, w, h).slice(0, 2)];
  }
  function subjectMap(channels, gray, w, h) {
    const n = w * h, side = Math.min(w, h);
    const small = channels.map(c => blur(c, w, h, Math.max(1, Math.round(side * .015))));
    const broad = channels.map(c => blur(c, w, h, Math.max(2, Math.round(side * .12))));
    const smallGray = new Float32Array(n), encoded = new Uint16Array(n);
    const allHist = new Float32Array(512), borderHist = new Float32Array(512);
    const border = Math.max(1, Math.round(side * .06)), means = [0, 0, 0];
    let borderCount = 0;
    for (let i = 0; i < n; i++) {
      const x = i % w, y = Math.floor(i / w);
      smallGray[i] = .299 * small[0][i] + .587 * small[1][i] + .114 * small[2][i];
      encoded[i] = Math.min(7, Math.floor(small[0][i] * 8)) * 64
        + Math.min(7, Math.floor(small[1][i] * 8)) * 8 + Math.min(7, Math.floor(small[2][i] * 8));
      allHist[encoded[i]]++;
      if (x < border || y < border || x >= w-border || y >= h-border) { borderHist[encoded[i]]++; borderCount++; }
      for (let c = 0; c < 3; c++) means[c] += small[c][i] / n;
    }
    for (let i = 0; i < 512; i++) { allHist[i] /= n; borderHist[i] /= Math.max(1, borderCount); }
    const allDensity = smoothHistogram(allHist), borderDensity = smoothHistogram(borderHist);
    const coarse = new Float32Array(n), globalContrast = new Float32Array(n), fine = new Float32Array(n);

      const repeat = previous && previous.ids === ids && hits[previous.index].id === selectedBoxId
        && Math.hypot(event.clientX-previous.x,event.clientY-previous.y) < 4;
      // A second press may be the start of a drag. Keep the selected box until
      // pointerup confirms a click, so selecting then dragging cannot switch it.
      const index = repeat ? previous.index : 0;
      const hit = hits[index];
      selectedBoxId = hit.id;
      selectionCycle = {ids, index, x: event.clientX, y: event.clientY};
      activeDrag = {pointerId: event.pointerId, id: hit.id, origin: hit.box.slice(),
        x: point.x, y: point.y, clientX: event.clientX, clientY: event.clientY,
        state: editorState, revision: editorRevision, moved: false,
        repeatClick: !!repeat, hitIds: hits.map(candidate => candidate.id), hitIndex: index};
      output.setPointerCapture(event.pointerId);
      output.style.cursor = "grabbing";
      updateEditingControls();
      drawEditGuide();
    });
    output.addEventListener("pointermove", event => {
      if (!editingEnabled()) return;
      if (activeDrag) {
        if (event.pointerId !== activeDrag.pointerId) return;
        if (event.pointerType === "mouse" && !(event.buttons & 1)) {
          cancelBoxDrag();
          renderOverlay();
          return;
        }
        event.preventDefault();
        moveBoxPointer(event);
      } else output.style.cursor = boxHits(event).length ? "move" : "default";
    });
    output.addEventListener("pointerup", event => {
      if (!activeDrag || event.pointerId !== activeDrag.pointerId) return;
      moveBoxPointer(event);
      const finished = activeDrag;
      activeDrag = null;
      releaseBoxPointer(event.pointerId);
      if (finished.moved) selectionCycle = null;
      else if (finished.repeatClick && finished.hitIds.length > 1) {
        const next = (finished.hitIndex + 1) % finished.hitIds.length;
        selectedBoxId = finished.hitIds[next];
        selectionCycle.index = next;
        updateEditingControls();
      }
      output.style.cursor = boxHits(event).length ? "move" : "default";
      drawEditGuide();
    });
    output.addEventListener("pointercancel", event => {
      if (activeDrag && event.pointerId === activeDrag.pointerId) {
        cancelBoxDrag();
        renderOverlay();
      }
    });
    output.addEventListener("lostpointercapture", () => {
      if (activeDrag && !output.hasPointerCapture(activeDrag.pointerId)) {
        cancelBoxDrag();
        renderOverlay();
      }
    });
    output.addEventListener("pointerleave", () => {
      if (!activeDrag) output.style.cursor = "";
    });
    // Key handling stays on the focused canvas, never on document/input fields.
    output.addEventListener("keydown", event => {
      if (event.key === "Delete" && !event.isComposing && event.target === output) {
        if (editingEnabled() && selectedEntry()) { event.preventDefault(); deleteSelectedBox(); }
      } else if (event.key === "Escape" && editingEnabled()) {
        cancelBoxDrag();
        selectedBoxId = selectionCycle = null;
        renderOverlay();
      }
    });
    let guideSize = null;
    const guideResize = new ResizeObserver(() => {
      const bounds = output.getBoundingClientRect();
      if (activeDrag && guideSize && guideSize.width > 0 &&
          (Math.abs(guideSize.width-bounds.width) > .5 || Math.abs(guideSize.height-bounds.height) > .5)) {
        cancelBoxDrag();
        renderOverlay();
      }
      guideSize = {width: bounds.width, height: bounds.height};
      drawEditGuide();
    });
    guideResize.observe(output);
    strokeWidth.addEventListener("change", renderOverlay);
    overlayColor.addEventListener("change", renderOverlay);
    overlayStyle.addEventListener("change", renderOverlay);
    baseFilter.addEventListener("change", renderOverlay);
    for(const layer of effectLayers) layer.select.addEventListener("change",renderOverlay);
    xrayInvert.addEventListener("change", renderOverlay);
    let baseFrame = null;
    for(const slider of [vignette,xrayHue,xraySaturation,xrayLightness,...effectLayers.flatMap(layer=>[layer.strength,layer.hue,layer.saturation,layer.lightness])]) slider.addEventListener("input", () => {
      slider.parentElement.querySelector("output").value = slider.value;
      if (baseFrame !== null) return;
      baseFrame = requestAnimationFrame(() => { baseFrame = null; renderOverlay(); });
    });
    let distortionFrame = null;
    distortionStrength.addEventListener("input", () => {
      distortionValue.value = distortionStrength.value;
      // Coalesce fast slider events; styling never re-enters Detection.
      if (distortionFrame !== null) return;
      distortionFrame = requestAnimationFrame(() => {
        distortionFrame = null;
        renderOverlay();
      });
    });
    labelMode.addEventListener("change", renderOverlay);
    customText.addEventListener("input", () => {
      // Synchronous local updates preserve a trailing space while typing a
      // phrase, and preserve the caret when editing in the middle of a word.
      const sanitize = value => value.replace(/[^A-Za-z '\-]/g, "").toUpperCase().slice(0,32);
      const caret = sanitize(customText.value.slice(0,customText.selectionStart)).length;
      customText.value = sanitize(customText.value);
      customText.setSelectionRange(caret,caret);
      renderOverlay();
    });
    shuffleWord.addEventListener("click", () => {
      if (!retained || !cachedLayers || labelMode.value !== "Emotion Pool") return;
      wordState = ObserverOverlay.shuffleWord(wordState);
      renderOverlay();
    });
    downloadPNG.addEventListener("click", () => {
      if (!retained || !cachedLayers || pendingExport) return;
      if (baseFrame !== null) {
        cancelAnimationFrame(baseFrame); baseFrame = null; renderOverlay();
      }
      if (distortionFrame !== null) {
        cancelAnimationFrame(distortionFrame);
        distortionFrame = null;
        renderOverlay();
      }
      const token = {generation};
      pendingExport = token;
      downloadPNG.disabled = true;
      // Freeze the visible result at click time. Later parameter changes cannot
      // change this export; uploading a new image cancels its stale callback.
      const snapshot = document.createElement("canvas");
      snapshot.width = output.width;
      snapshot.height = output.height;
      snapshot.getContext("2d").drawImage(output,0,0);
      const mode = labelMode.value === "Emotion Pool" ? "pool" : labelMode.value === "Custom Text" ? "custom" : "off";
      const point = focus ? `focus_${focus[0]}_${focus[1]}` : "auto";
      const styleName = overlayStyle.value === "VECTOR" ? "vector" : overlayStyle.value === "SCAN" ? `scan_d${distortionStrength.value}` : "ink";
      const filename = `image_observer_html_build_02_6_2_${styleName}_${overlayColor.value.slice(1)}_s${output.dataset.structure.padStart(3,"0")}_${point}_${strokeWidth.value.toLowerCase()}_${mode}.png`;
      function finish(blob) {
        snapshot.width = snapshot.height = 1;
        if (pendingExport !== token || generation !== token.generation) return;
        pendingExport = null;
        downloadPNG.disabled = false;
        if (!blob) { message("PNG 保存失败，请重试。","error"); return; }
        const url = URL.createObjectURL(blob), link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url),1000);
      }
      try { snapshot.toBlob(finish,"image/png"); }
      catch (_) { finish(null); }
    });
    upload.addEventListener("change",() => showImage(upload.files[0]));
    // Reset just the picker so selecting the same file again triggers analysis.
    upload.addEventListener("click",() => { upload.value = ""; });
    for (const eventName of ["dragenter","dragover"]) {
      dropZone.addEventListener(eventName,event => {
        event.preventDefault();
        dropZone.classList.add("dragging");
      });
    }
    dropZone.addEventListener("dragleave",() => dropZone.classList.remove("dragging"));
    dropZone.addEventListener("drop",event => {
      event.preventDefault();
      dropZone.classList.remove("dragging");
      showImage(event.dataTransfer.files[0]);
    });
    updateEditingControls();
  </script>
</body>
</html>
