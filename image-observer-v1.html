    catch (_) { return fallback(w,h); }
  }
  // Build 02 layers reuse the Build 01.1 base; Structure only changes prefixes.
  const layerCache = new WeakMap();
  function microBoxes(frame, seed) {
    const { width:w, height:h, boxes, subject, detail } = frame;
    const main = boxes[0], mw = main[2]-main[0], mh = main[3]-main[1];
    if (!subject || !detail || Math.min(w,h)<32 || mw<20 || mh<20) return [];
    const roi = [Math.max(0,Math.floor(main[0]-.15*mw)),Math.max(0,Math.floor(main[1]-.15*mh)),
      Math.min(w,Math.ceil(main[2]+.15*mw)),Math.min(h,Math.ceil(main[3]+.15*mh))];
    const weights = new Float32Array(w*h);
    let total = 0;
    for (let y=roi[1];y<roi[3];y++) for (let x=roi[0];x<roi[2];x++) {
      const i=y*w+x;
      const affinity=(x<main[0]||x>=main[2]?.35:1)*(y<main[1]||y>=main[3]?.35:1);
      weights[i] = detail[i]**1.3*(.05+.95*subject[i]**1.4)*affinity; total += weights[i];
    }
    if (total<1e-5) return [];
    const peaks = Float32Array.from(weights), anchors = [];
    let strongest = 0; for (const value of weights) strongest = Math.max(strongest,value);
    const nx = Math.max(1,Math.round(.13*mw)), ny = Math.max(1,Math.round(.13*mh));
    for (let p=0;p<5;p++) {
      let index = 0;
      for (let i=1;i<peaks.length;i++) if (peaks[i]>peaks[index]) index=i;
      if (peaks[index]<Math.max(1e-7,.08*strongest)) break;
      const x=index%w,y=Math.floor(index/w); anchors.push([x,y]);
      for (let yy=Math.max(roi[1],y-ny);yy<Math.min(roi[3],y+ny+1);yy++)
        peaks.fill(0,yy*w+Math.max(roi[0],x-nx),yy*w+Math.min(roi[2],x+nx+1));
    }
    if (!anchors.length) return [];
    // Local weighted sampling creates clusters around image details, not frame-wide noise.
    const rx=Math.max(1,Math.round(.065*mw)),ry=Math.max(1,Math.round(.065*mh));
    const neighborhoods=anchors.map(([cx,cy])=>{
      const indices=[],cdf=[];let mass=0;
      for(let y=Math.max(roi[1],cy-ry);y<Math.min(roi[3],cy+ry+1);y++)
        for(let x=Math.max(roi[0],cx-rx);x<Math.min(roi[2],cx+rx+1);x++) {
          const i=y*w+x;mass+=weights[i];indices.push(i);cdf.push(mass);

    });
    let state=Number(seed)>>>0;
    const random=()=>{state=(Math.imul(1664525,state)+1013904223)>>>0;return state/4294967296;};
    const mediumMin=Math.min(...boxes.slice(1).map(area));
    const maximum=Math.min(.012*mw*mh,.25*mediumMin);

      while(low<high){const mid=(low+high)>>1;if(local.cdf[mid]<=target)low=mid+1;else high=mid;}

    const h=Math.max(1,Math.round(Number(image&&image.height)||1));
    const amount=clamp(Number(structure)||0,0,100), key=Number(seed)>>>0;

    if(!frame){
      frame={width:w,height:h,micro:new Map()};

      catch (_) {frame.boxes=fallback(w,h);}

      medium:frame.boxes.slice(1,1+2+Math.round(3*amount/100)).map(copy),

  </script>
  <script>
    "use strict";
    const upload = document.getElementById("upload");
    const dropZone = document.getElementById("dropZone");
    const original = document.getElementById("original");
    const output = document.getElementById("output");
    const status = document.getElementById("status");
    const originalPlaceholder = document.getElementById("originalPlaceholder");
    const outputPlaceholder = document.getElementById("outputPlaceholder");
    const structure = document.getElementById("structure");
    const structureValue = document.getElementById("structureValue");
    let generation = 0, retained = null, structureTimer;

    function clearImages() {
      clearTimeout(structureTimer);
      retained = null;
      for (const canvas of [original, output]) {
        canvas.hidden = true;
        canvas.width = canvas.height = 1;
      }
      delete output.dataset.boxes;
      delete output.dataset.layers;
      delete output.dataset.structure;
      originalPlaceholder.hidden = outputPlaceholder.hidden = false;
    }

    function message(text, state) {
      status.textContent = text;
      status.dataset.state = state;
    }

    function renderOutput() {
      if (!retained) return;
      const {data, width, height} = retained, amount = Number(structure.value);
      let result;
      try {
        const detected = data ? ObserverDetector.layers(data, amount, 0) : null;
        if (!detected) throw new Error("Analysis unavailable");
        const sx = width / data.width, sy = height / data.height;
        const scale = (box, kind) => {
          const b = [box[0]*sx,box[1]*sy,box[2]*sx,box[3]*sy];
          if (kind !== "micro") return ObserverDetector.fit(b,width,height,
            kind === "main" ? .08 : .008,kind === "main" ? .8 : .14);
          const x1 = Math.max(0,Math.min(width-1,Math.round(b[0])));
          const y1 = Math.max(0,Math.min(height-1,Math.round(b[1])));
          return [x1,y1,Math.max(x1+1,Math.min(width,Math.round(b[2]))),
            Math.max(y1+1,Math.min(height,Math.round(b[3])))];
        };
        result = Object.fromEntries(["main","medium","micro"].map(kind =>
          [kind,detected[kind].map(box => scale(box,kind))]));
      } catch (error) {
        console.warn("Using the stable detection fallback.", error);
        const boxes = ObserverDetector.fallback(width,height);
        result = {main:boxes.slice(0,1),medium:boxes.slice(1),micro:[]};
      }
      const context = output.getContext("2d");
      context.drawImage(original,0,0);
      context.fillStyle = "rgb(0, 80, 255)";
      function draw(boxes, stroke) {
        for (const [x1,y1,x2,y2] of boxes) {
          const line = Math.min(stroke,x2-x1,y2-y1);
          context.fillRect(x1,y1,x2-x1,line);
          context.fillRect(x1,y2-line,x2-x1,line);
          context.fillRect(x1,y1,line,y2-y1);
          context.fillRect(x2-line,y1,line,y2-y1);
        }
      }
      draw(result.main,Math.min(width,height)>=120?2:1);
      draw(result.medium,1);
      draw(result.micro,1);
      output.dataset.layers = JSON.stringify(result);
      output.dataset.structure = String(amount);
      output.dataset.boxes = JSON.stringify([...result.main,...result.medium,...result.micro]);
      original.hidden = output.hidden = false;
      originalPlaceholder.hidden = outputPlaceholder.hidden = true;
    }

    async function showImage(file) {
      const current = ++generation;
      clearImages();
      if (!file) {
        message("请选择一张图片。", "empty");
        return;
      }
      message("正在分析图片…", "loading");
      let objectURL;
      try {
        // Inspect file signatures instead of trusting an extension or MIME type.
        const header = new Uint8Array(await file.slice(0,12).arrayBuffer());
        if (current !== generation) return;
        const jpeg = header[0]===255 && header[1]===216 && header[2]===255;
        const pngSignature = [137,80,78,71,13,10,26,10];
        const png = pngSignature.every((value,index) => header[index]===value);
        if (!jpeg && !png) throw new Error("请使用完整的 JPG 或 PNG 图片。");
        objectURL = URL.createObjectURL(file);
        const image = new Image();
        image.src = objectURL;
        // Current Chrome / Edge apply JPEG EXIF orientation during decoding.
        await image.decode();
        if (current !== generation) return;
        const scale = Math.min(1,1600/Math.max(image.naturalWidth,image.naturalHeight));
        const width = Math.max(1,Math.round(image.naturalWidth*scale));
        const height = Math.max(1,Math.round(image.naturalHeight*scale));
        original.width = output.width = width;
        original.height = output.height = height;
        const sourceContext = original.getContext("2d",{willReadFrequently:true});
        sourceContext.fillStyle = "#fff";
        sourceContext.fillRect(0,0,width,height);
        sourceContext.imageSmoothingQuality = "high";
        sourceContext.drawImage(image,0,0,width,height);
        let data = null;
        try {
          const analysis = document.createElement("canvas");
          const analysisScale = Math.min(1,480/Math.max(width,height));
          analysis.width = Math.max(1,Math.round(width*analysisScale));
          analysis.height = Math.max(1,Math.round(height*analysisScale));
          const context = analysis.getContext("2d",{willReadFrequently:true});
          context.drawImage(original,0,0,analysis.width,analysis.height);
          data = context.getImageData(0,0,analysis.width,analysis.height);
        } catch (error) { console.warn("Using the stable detection fallback.",error); }
        retained = {data,width,height};
        // Read the current slider after decoding; pending uploads use its latest value.
        renderOutput();
        message(`${file.name} · ${width} × ${height} · 完成`,"done");
      } catch (error) {
        if (current !== generation) return;
        clearImages();
        message(error.message.includes("JPG") ? error.message : "无法读取图片，请重新选择完整的 JPG 或 PNG 文件。","error");
      } finally {
        if (objectURL) URL.revokeObjectURL(objectURL);
      }
    }

    structure.addEventListener("input",() => {
      structureValue.value = structure.value;
      structureValue.textContent = structure.value;
      clearTimeout(structureTimer);
      structureTimer = setTimeout(renderOutput,80);
    });
    upload.addEventListener("change",() => showImage(upload.files[0]));
    // Reset just the picker so selecting the same file again triggers analysis.
    upload.addEventListener("click",() => { upload.value = ""; });
    for (const eventName of ["dragenter","dragover"]) {
      dropZone.addEventListener(eventName,event => {
        event.preventDefault();
        dropZone.classList.add("dragging");
      });
    }
    dropZone.addEventListener("dragleave",() => dropZone.classList.remove("dragging"));
    dropZone.addEventListener("drop",event => {
      event.preventDefault();
      dropZone.classList.remove("dragging");
      showImage(event.dataTransfer.files[0]);
    });
  </script>
